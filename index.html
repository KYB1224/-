<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隨手比價 PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* 自定義強制字體大小，避免手機表單（日期、下拉選單）縮小 */
        .force-text-base {
            font-size: 1rem !important;
            line-height: 1.5rem !important;
        }
        select, input {
            font-size: 1rem !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-xs z-10">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            隨手比價
        </h1>
        <div class="flex items-center gap-2">
            <button id="sync-status-btn" class="flex items-center gap-1.5 bg-sky-50 text-sky-600 px-3 py-1.5 rounded-full text-xs font-medium border border-sky-100 active:scale-95 transition">
                <i class="fa-solid fa-cloud"></i> 雲端同步
            </button>
            <button id="group-config-btn" class="flex items-center gap-1.5 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-full text-xs font-medium border border-amber-200 active:scale-95 transition">
                <i class="fa-solid fa-users"></i> <span id="header-group-name">群組: HOME-8899</span>
            </button>
            <button onclick="location.reload()" class="text-slate-400 hover:text-slate-600 p-1.5">
                <i class="fa-solid fa-rotate text-sm"></i>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 overflow-y-auto pb-24">
        <!-- 頁籤 1：查價格 / 記一筆 -->
        <div id="tab-record" class="p-4 max-w-xl mx-auto space-y-4">
            
            <!-- 拍照自動帶入 -->
            <div class="border-2 border-dashed border-sky-300 bg-sky-50/50 rounded-2xl p-4 text-center active:bg-sky-100 transition cursor-pointer" onclick="alert('拍照自動辨識功能建置中')">
                <div class="text-sky-600 text-2xl mb-1"><i class="fa-solid fa-camera"></i></div>
                <div class="text-sm font-bold text-sky-800"><i class="fa-solid fa-receipt mr-1"></i> 拍照自動帶入 (發票 / 價格標籤)</div>
            </div>

            <!-- 表單區 -->
            <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-100 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">通路</label>
                        <div class="relative">
                            <select id="market" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 force-text-base appearance-none focus:outline-none focus:ring-2 focus:ring-sky-500">
                                <option value="全聯">全聯</option>
                                <option value="家樂福">家樂福</option>
                                <option value="大潤發">大潤發</option>
                                <option value="Costco">Costco</option>
                                <option value="momo">momo</option>
                                <option value="蝦皮">蝦皮</option>
                                <option value="其他">其他</option>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-sm">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">日期</label>
                        <input type="date" id="date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 force-text-base focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">商品名稱</label>
                        <input type="text" id="product-name" placeholder="例：林鳳營鮮乳" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 force-text-base focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">類別</label>
                        <div class="relative">
                            <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 force-text-base appearance-none focus:outline-none focus:ring-2 focus:ring-sky-500">
                                <option value="肉品">肉品</option>
                                <option value="蔬菜">蔬菜</option>
                                <option value="水果">水果</option>
                                <option value="乳品/飲料">乳品/飲料</option>
                                <option value="日用品">日用品</option>
                                <option value="其他">其他</option>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-sm">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">金額</label>
                        <input type="number" id="price" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 force-text-base text-center font-bold focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">容量 / 數量</label>
                        <input type="number" id="quantity" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 force-text-base text-center font-bold focus:outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">單位</label>
                        <div class="relative">
                            <select id="unit" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 force-text-base appearance-none focus:outline-none focus:ring-2 focus:ring-sky-500">
                                <option value="ml">ml</option>
                                <option value="g">g</option>
                                <option value="件">件</option>
                                <option value="包">包</option>
                                <option value="瓶">瓶</option>
                                <option value="顆">顆</option>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-sm">
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">備註 (選填)</label>
                    <input type="text" id="note" placeholder="例：買一送一、特價優惠" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 force-text-base focus:outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" onclick="calculateUnit()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition flex flex-col items-center justify-center">
                        <span class="text-xs font-normal opacity-90">換算單價</span>
                        <span id="unit-price-preview" class="text-lg">$0.00 / ml</span>
                    </button>
                    <button type="button" onclick="saveRecord()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-4 rounded-xl shadow-md active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 儲存記錄至雲端
                    </button>
                </div>
            </div>
        </div>

        <!-- 頁籤 2：購物清單 -->
        <div id="tab-list" class="p-4 max-w-xl mx-auto hidden">
            <div class="bg-white rounded-2xl p-6 text-center text-slate-500 border border-slate-100">
                <i class="fa-solid fa-basket-shopping text-4xl mb-2 text-slate-300"></i>
                <p>購物清單功能建置中</p>
            </div>
        </div>

        <!-- 頁籤 3：分析 -->
        <div id="tab-analytics" class="p-4 max-w-xl mx-auto hidden">
            <div class="bg-white rounded-2xl p-6 text-center text-slate-500 border border-slate-100">
                <i class="fa-solid fa-chart-line text-4xl mb-2 text-slate-300"></i>
                <p>比價分析功能建置中</p>
            </div>
        </div>
    </main>

    <!-- 群組設定彈跳視窗 (Modal) -->
    <div id="group-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl border border-slate-100 space-y-4 relative">
            <button onclick="toggleGroupModal(false)" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="flex items-center gap-3 text-amber-700">
                <i class="fa-solid fa-users text-2xl"></i>
                <h3 class="text-lg font-bold">家人共用群組設定</h3>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
                切換或輸入家庭群組代碼，只有輸入相同代碼的人才能同步看到彼此的資料！
            </p>
            <div class="bg-amber-50/60 border border-amber-200/60 rounded-2xl p-4 space-y-2">
                <label class="block text-xs font-bold text-amber-900">目前群組代碼：</label>
                <div class="flex items-center gap-2">
                    <div id="current-group-display" class="flex-1 bg-white border border-amber-200 rounded-xl px-3 py-2 text-amber-800 font-bold tracking-wider text-center">
                        HOME-8899
                    </div>
                    <button onclick="copyGroupCode()" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition">
                        複製
                    </button>
                </div>
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-600">切換或加入其他群組代碼：</label>
                <input type="text" id="new-group-input" placeholder="例：MYHOME-168" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 force-text-base focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <button onclick="changeGroupCode()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition">
                確定切換
            </button>
        </div>
    </div>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 flex justify-around items-center h-16 px-2 z-20 shadow-lg">
        <button onclick="switchTab('search')" class="nav-btn flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-sky-600 transition" data-tab="search">
            <i class="fa-solid fa-magnifying-glass text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">查價格</span>
        </button>
        <button onclick="switchTab('list')" class="nav-btn flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-sky-600 transition" data-tab="list">
            <i class="fa-solid fa-basket-shopping text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">購物清單</span>
        </button>
        <div class="flex-1 flex justify-center -mt-6">
            <button onclick="switchTab('record')" class="w-14 h-14 bg-sky-500 hover:bg-sky-600 text-white rounded-full shadow-lg flex items-center justify-center text-2xl active:scale-95 transition border-4 border-white">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        <button onclick="switchTab('record')" class="nav-btn flex flex-col items-center justify-center flex-1 text-sky-600 font-bold transition" data-tab="record">
            <span class="text-xs mb-0.5 h-[18px]"></span>
            <span class="text-[10px] font-medium">記一筆</span>
        </button>
        <button onclick="switchTab('analytics')" class="nav-btn flex flex-col items-center justify-center flex-1 text-slate-400 hover:text-sky-600 transition" data-tab="analytics">
            <i class="fa-solid fa-chart-line text-lg mb-0.5"></i>
            <span class="text-[10px] font-medium">分析</span>
        </button>
    </nav>

    <!-- JavaScript 邏輯 -->
    <script>
        // 初始化載入
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;

            // 讀取儲存的群組代碼（若無則預設 HOME-8899）
            const savedGroup = localStorage.getItem('pwa_group_code') || 'HOME-8899';
            updateGroupUI(savedGroup);

            // 綁定群組設定按鈕開啟 Modal
            document.getElementById('group-config-btn').addEventListener('click', () => {
                toggleGroupModal(true);
            });
        });

        // 更新群組 UI 顯示
        function updateGroupUI(code) {
            document.getElementById('header-group-name').innerText = `群組: ${code}`;
            document.getElementById('current-group-display').innerText = code;
        }

        // 開啟/關閉群組設定視窗
        function toggleGroupModal(show) {
            const modal = document.getElementById('group-modal');
            const inputField = document.getElementById('new-group-input');
            if (show) {
                modal.classList.remove('hidden');
                // 每次打開時，將目前群組代碼帶入輸入框，方便使用者直接在此修改
                const current = localStorage.getItem('pwa_group_code') || 'HOME-8899';
                inputField.value = current;
            } else {
                modal.classList.add('hidden');
            }
        }

        // 更改/自訂群組代碼邏輯
        function changeGroupCode() {
            const inputVal = document.getElementById('new-group-input').value.trim();
            if (!inputVal) {
                alert('請輸入自訂的群組代碼！');
                return;
            }
            // 儲存至 localStorage（保留大小寫或轉大寫皆可，這裡直接儲存並保持原樣或轉大寫）
            const newCode = inputVal; 
            localStorage.setItem('pwa_group_code', newCode);
            
            // 即時更新畫面各處的群組代碼顯示
            updateGroupUI(newCode);
            
            // 關閉彈跳視窗
            toggleGroupModal(false);
            
            alert(`已成功更新群組代碼為：${newCode}`);
        }

        // 複製群組代碼
        function copyGroupCode() {
            const code = document.getElementById('current-group-display').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('已複製群組代碼：' + code);
            }).catch(err => {
                console.error('複製失敗', err);
            });
        }

        // 頁籤切換
        function switchTab(tabName) {
            document.getElementById('tab-record').classList.add('hidden');
            document.getElementById('tab-list').classList.add('hidden');
            document.getElementById('tab-analytics').classList.add('hidden');

            if (tabName === 'record' || tabName === 'search') {
                document.getElementById('tab-record').classList.remove('hidden');
            } else if (tabName === 'list') {
                document.getElementById('tab-list').classList.remove('hidden');
            } else if (tabName === 'analytics') {
                document.getElementById('tab-analytics').classList.remove('hidden');
            }
        }

        // 單價計算
        function calculateUnit() {
            const price = parseFloat(document.getElementById('price').value) || 0;
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const unit = document.getElementById('unit').value;

            if (quantity <= 0) {
                document.getElementById('unit-price-preview').innerText = `$0.00 / ${unit}`;
                return;
            }

            const unitPrice = price / quantity;
            document.getElementById('unit-price-preview').innerText = `$${unitPrice.toFixed(2)} / ${unit}`;
        }

        // 儲存記錄
        function saveRecord() {
            const name = document.getElementById('product-name').value.trim();
            if (!name) {
                alert('請輸入商品名稱！');
                return;
            }
            const groupCode = localStorage.getItem('pwa_group_code') || 'HOME-8899';
            alert(`[群組: ${groupCode}] 記錄儲存成功！`);
        }
    </script>
</body>
</html>
